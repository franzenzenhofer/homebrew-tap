# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Verify conditional Node selection
        run: |
          compatible_dir="$RUNNER_TEMP/cdai node 20/bin"
          old_dir="$RUNNER_TEMP/cdai-node-18/bin"
          mkdir -p "$compatible_dir" "$old_dir"
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" "CDAI_NODE_MAJOR=22"' > "$compatible_dir/node"
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" "CDAI_NODE_MAJOR=18"' > "$old_dir/node"
          chmod +x "$compatible_dir/node" "$old_dir/node"

          PATH="$compatible_dir:$PATH" brew ruby -e '
            formula = Formula["franzenzenhofer/tap/cdai"]
            abort "compatible external Node unexpectedly added a formula dependency" unless formula.deps.empty?
            abort "compatible external Node requirement missing" unless formula.requirements.one?
          '

          PATH="$old_dir:$PATH" brew ruby -e '
            formula = Formula["franzenzenhofer/tap/cdai"]
            abort "old Node did not select the Homebrew Node fallback" unless formula.deps.map(&:name) == ["node"]
            abort "old Node unexpectedly satisfied the external requirement" unless formula.requirements.empty?
          '

      - run: brew test-bot --only-formulae

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
